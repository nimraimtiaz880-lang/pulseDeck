<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PulseDeck for PowerPoint</title><link rel="stylesheet" href="taskpane.css"><script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script></head><body><header><div class="mark">P</div><div><b>PulseDeck</b><small>Lecture assistant</small></div></header><main><p class="eyebrow">FROM YOUR PRESENTATION</p><h1>What do you need?</h1><p class="hint">Select text on a slide, then use “Read selected text”, or paste lecture notes below.</p><button id="readSelection">Read selected text</button><label for="lecture">Lecture text</label><textarea id="lecture" rows="10" placeholder="Select text in PowerPoint or paste slide content…"></textarea><label for="action">Create</label><select id="action"><option value="summary">Lecture summary</option><option value="quiz">Quiz</option><option value="scenario">Scenario activity</option><option value="discussion">Discussion prompts</option><option value="poll">Class poll</option></select><button class="primary" id="generate">Generate with PulseDeck</button><p id="status" role="status"></p><textarea id="output" rows="12" placeholder="Your editable draft will appear here…"></textarea><button id="copy">Copy draft</button><p class="footnote">Review content before sharing. Configure the API URL in taskpane.js for your deployed PulseDeck instance.</p></main><script src="taskpane.js"></script></body></html>
